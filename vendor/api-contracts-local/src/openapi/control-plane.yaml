    MachineSummaryReport:
      type: object
      required:
        [
          device_id,
          machine_id,
          machine_name,
          user_name,
          agent_version,
          schema_version,
          policy_version,
          reported_at_utc,
          agent_running,
          user_session_connected,
          activity_detected,
          capture_context,
          keyboard_signal_active,
          mouse_signal_active,
          backend_connected,
          local_api_auth_ready,
          db_migration_failed,
          focus_episode_quality,
          focus_episode_seconds,
          focus_episode_state,
          attention_segment_kind,
          attention_segment_seconds,
          distraction_episode_active,
          distraction_episode_seconds,
          task_continuity_score,
          task_continuity_seconds,
          continuity_state,
          deep_work_active,
          pressure_level,
          pressure_confidence,
          overload_likelihood,
          overload_active,
          break_needed,
          calibration_stage,
          trust_tier,
          model_confidence,
          partial_data,
          missing_major_channels
        ]
      properties:
        device_id:
          type: string
          format: uuid
        machine_id:
          type: string
        account_id:
          type: string
          format: uuid
          nullable: true
        org_id:
          type: string
          format: uuid
          nullable: true
        machine_name:
          type: string
        user_name:
          type: string
        agent_version:
          type: string
        schema_version:
          type: string
        policy_version:
          type: string
        reported_at_utc:
          type: string
          format: date-time
        agent_running:
          type: boolean
        user_session_connected:
          type: boolean
        activity_detected:
          type: boolean
        last_activity_utc:
          type: string
          format: date-time
          nullable: true
        user_agent_heartbeat_utc:
          type: string
          format: date-time
          nullable: true
        capture_context:
          $ref: '#/components/schemas/CaptureContextValue'
        keyboard_signal_active:
          type: boolean
        mouse_signal_active:
          type: boolean
        ownership_warning:
          type: string
          nullable: true
        capture_failure_reason:
          type: string
          nullable: true
        last_error:
          type: string
          nullable: true
        backend_connected:
          type: boolean
        local_api_auth_ready:
          type: boolean
        db_migration_failed:
          type: boolean
        focus_episode_quality:
          type: number
          minimum: 0
          maximum: 1
          description: Canonical durable focus-episode quality field. Prefer this over task_continuity_score when presenting product truth.
        focus_episode_seconds:
          type: number
          minimum: 0
          description: Canonical durable focus-episode duration. This is the user-facing focus timer and must not be treated as current foreground-app age.
        focus_episode_state:
          $ref: '#/components/schemas/ContinuityStateValue'
        focus_episode_reason_code:
          type: string
          nullable: true
          description: Canonical focus-episode reason code. This explains why the current focus episode is active, paused, fading, or reset.
        focus_episode_reason_text:
          type: string
          nullable: true
          description: Human-readable explanation for the current focus-episode state or ending reason.
        attention_segment_kind:
          type: string
          enum: [focus, context_excursion, off_task_distraction, fragmentation_distraction, away]
          description: Canonical current attention segment. This distinguishes steady focus from short context excursions, distraction episodes, and away time.
        attention_segment_seconds:
          type: number
          minimum: 0
          description: Duration of the current attention segment in seconds.
        attention_segment_reason_code:
          type: string
          nullable: true
          description: Canonical attention-segment reason code. This explains why the machine is currently classified as focus, excursion, distraction, or away.
        attention_segment_reason_text:
          type: string
          nullable: true
          description: Human-readable explanation for the current attention-segment classification.
        distraction_episode_active:
          type: boolean
          description: True only when the current attention segment is a real distraction episode.
        distraction_episode_seconds:
          type: number
          minimum: 0
          description: Duration of the current distraction episode in seconds. Away time and short context excursions do not count here.
        task_continuity_score:
          type: number
          minimum: 0
          maximum: 1
          description: Legacy compatibility field for continuity quality. Canonical product meaning is focus-episode quality.
        task_continuity_seconds:
          type: number
          minimum: 0
          description: Legacy compatibility field for the durable focus timer. Canonical product meaning is focus-episode duration, not foreground-app age.
        continuity_state:
          $ref: '#/components/schemas/ContinuityStateValue'
        deep_work_active:
          type: boolean
        pressure_level:
          type: number
          minimum: 0
          maximum: 1
          description: Canonical user-facing pressure signal. Prefer this over overload_likelihood when presenting product truth to humans.
        pressure_confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Canonical confidence for the displayed pressure signal. Show this separately from pressure instead of hiding pressure when confidence is limited.
        overload_likelihood:
          type: number
          minimum: 0
          maximum: 1
          description: Legacy visible overload field. Canonical product meaning is pressure.
        overload_active:
          type: boolean
          description: Conservative stabilized overload state used for interventions and system actions.
        break_needed:
          type: boolean
        break_pending_action:
          type: string
          nullable: true
          description: Legacy break transport action ID. During migration it may still carry stretch_break_suggestion or break_suggestion, which map to short break and long break.
        break_pending_reason_code:
          type: string
          nullable: true
        calibration_stage:
          $ref: '#/components/schemas/CalibrationStageValue'
        trust_tier:
          $ref: '#/components/schemas/TrustTierValue'
        model_confidence:
          type: number
          minimum: 0
          maximum: 1
        signal_quality_score:
          type: number
          minimum: 0
          maximum: 1
          nullable: true
        partial_data:
          type: boolean
        missing_major_channels:
          type: array
          items:
            type: string

